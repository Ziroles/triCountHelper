name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Typage, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Typage
        run: npm run typecheck

      - name: Tests
        # L'API est simulée (`src/test/fakeApi.ts`) : aucun appel réseau.
        run: npm test

      - name: Build
        run: npm run build
