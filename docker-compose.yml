services:
  splitticket:
    build:
      context: .
      args:
        # Publics : intégrés au paquet livré. Jamais de secret ici.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SIGNUP_KEY: ${VITE_SIGNUP_KEY:-}
    container_name: splitticket
    restart: unless-stopped
    ports:
      - "${SPLITTICKET_PORT:-8080}:80"
